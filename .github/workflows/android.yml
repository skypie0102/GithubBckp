name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"
      - name: Build and test all supported variants
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assemblePersonal :app:testDebugUnitTest :app:lintDebug

      # Do not publish an installable APK from GitHub-hosted runners. Their
      # generated debug signing key is not stable across runs, which changes the
      # certificate SHA-1 and breaks Android OAuth clients such as Google Drive.
      # Build the optimized personal APK locally so it is signed by the user's
      # persistent ~/.android/debug.keystore.
