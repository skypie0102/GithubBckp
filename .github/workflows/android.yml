name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"
      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
      - name: Report release APK size
        run: ls -lh app/build/outputs/apk/release/*.apk
      - name: Diagnose v0.2.0 R8 crash classes
        run: |
          grep -E " -> ([Il]a0|wv2):$" app/build/outputs/mapping/release/mapping.txt || true
