name: Publish Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag override (for example v0.3.0)
        required: false
        type: string

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUBBCKP_KEYSTORE_PATH: ${{ github.workspace }}/release-signing.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve and validate release version
        id: release_version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          APP_VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION"
          test -n "$APP_VERSION_CODE"

          if [ -n "$REQUESTED_TAG" ]; then
            RELEASE_TAG="$REQUESTED_TAG"
          else
            RELEASE_TAG="v$APP_VERSION"
          fi

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "${RELEASE_TAG#v}" != "$APP_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match app versionName $APP_VERSION" >&2
            exit 1
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG already exists; no release needed."
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "Preparing $RELEASE_TAG from $GITHUB_SHA."
          fi

      - name: Prepare one-off Android signing key
        if: steps.release_version.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TEMP_PASSWORD='githubbckp-oneoff'
          TEMP_ALIAS='githubbckp-oneoff'

          keytool -genkeypair             -keystore "$GITHUBBCKP_KEYSTORE_PATH"             -storepass "$TEMP_PASSWORD"             -keypass "$TEMP_PASSWORD"             -alias "$TEMP_ALIAS"             -keyalg RSA             -keysize 2048             -validity 3650             -dname "CN=GitHub Backup ${RELEASE_TAG} One-Off Release, O=GithubBckp, C=PH"

          echo "GITHUBBCKP_KEYSTORE_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
          echo "GITHUBBCKP_KEY_ALIAS=$TEMP_ALIAS" >> "$GITHUB_ENV"
          echo "GITHUBBCKP_KEY_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.6
        if: steps.release_version.outputs.release_needed == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Accept Android SDK licenses
        if: steps.release_version.outputs.release_needed == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK
        if: steps.release_version.outputs.release_needed == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-37.0"             "build-tools;36.0.0"

      - name: Test and build release APK
        if: steps.release_version.outputs.release_needed == 'true'
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Verify, name, and checksum APK
        if: steps.release_version.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          OUTPUT="githubbckp-$RELEASE_TAG.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"

      - name: Upload release APK artifact
        if: steps.release_version.outputs.release_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: githubbckp-${{ env.RELEASE_TAG }}-release-apk
          path: |
            githubbckp-${{ env.RELEASE_TAG }}.apk
            githubbckp-${{ env.RELEASE_TAG }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.release_version.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: GitHub Backup ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Android release for GitHub Backup ${{ env.RELEASE_TAG }}.

            Version code: ${{ env.APP_VERSION_CODE }}
            Version name: ${{ env.RELEASE_VERSION }}
            Package: com.skypie0102.githubbckp
            Signing mode: disposable one-off Android key generated only for this release run
          files: |
            githubbckp-${{ env.RELEASE_TAG }}.apk
            githubbckp-${{ env.RELEASE_TAG }}.apk.sha256
